name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Auth for private room_scan_kit dependency
        env:
          ROOM_SCAN_KIT_GITHUB_TOKEN: ${{ secrets.ROOM_SCAN_KIT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROOM_SCAN_KIT_GITHUB_TOKEN:-}" ]]; then
            echo "Missing repo secret ROOM_SCAN_KIT_GITHUB_TOKEN (read access to uydoshtech/room_scan_kit)."
            exit 1
          fi
          git config --global url."https://x-access-token:${ROOM_SCAN_KIT_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test
