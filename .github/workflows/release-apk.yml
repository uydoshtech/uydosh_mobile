name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks
          file android/upload-keystore.jks
          test -s android/upload-keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to uydosh_client "android-latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: android-latest
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated build from commit ${SHORT_SHA} on $(date -u +'%Y-%m-%dT%H:%M:%SZ')."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "UyDosh Android APK (latest)" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Publish to uydoshtech.github.io "android-latest" release
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          SITE_REPO: uydoshtech/uydoshtech.github.io
          TAG: android-latest
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated build from uydosh_client@${SHORT_SHA} on $(date -u +'%Y-%m-%dT%H:%M:%SZ').

          If your browser warns about unknown sources, you may need to allow installs from this source."

          if gh release view "$TAG" --repo "$SITE_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$SITE_REPO" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$APK_PATH" \
            --repo "$SITE_REPO" \
            --title "UyDosh Android APK (latest)" \
            --notes "$NOTES" \
            --latest
