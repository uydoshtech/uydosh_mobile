name: Build & Release Android AAB

on:
  push:
    tags:
      - "android-*"
  workflow_dispatch:
    inputs:
      play_track:
        description: "Google Play track (internal, alpha, beta, production)"
        required: false
        default: "internal"
      play_release_status:
        description: "Google Play release status (draft, completed, inProgress)"
        required: false
        default: "draft"

concurrency:
  group: release-aab
  cancel-in-progress: true

# contents:write — rolling android-latest release in this repo (GITHUB_TOKEN).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          # TAG examples:
          # - android-1.2.3-45
          # - ios-1.2.3-45
          # (We also accept an optional 'v' prefix and the '+' variant for backward compatibility.)

          VERSION_WITH_BUILD="${TAG#android-}"
          VERSION_WITH_BUILD="${VERSION_WITH_BUILD#ios-}"
          VERSION_WITH_BUILD="${VERSION_WITH_BUILD#v}"

          if [[ "${VERSION_WITH_BUILD}" == *+* ]]; then
            BUILD_NAME="${VERSION_WITH_BUILD%%+*}"   # 1.2.3
            BUILD_NUMBER="${VERSION_WITH_BUILD##*+}" # 45
          elif [[ "${VERSION_WITH_BUILD}" == *-* ]]; then
            # Split on the LAST '-' to allow prerelease names like 1.2.3-rc.1-45
            BUILD_NUMBER="${VERSION_WITH_BUILD##*-}"
            BUILD_NAME="${VERSION_WITH_BUILD%-${BUILD_NUMBER}}"
          else
            echo "Could not parse build name/number from tag: ${TAG}"
            exit 1
          fi

          if [[ -z "${BUILD_NAME}" || -z "${BUILD_NUMBER}" || "${BUILD_NAME}" == "${BUILD_NUMBER}" ]]; then
            echo "Could not parse build name/number from tag: ${TAG}"
            exit 1
          fi

          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"

          echo "Parsed BUILD_NAME=${BUILD_NAME} BUILD_NUMBER=${BUILD_NUMBER}"

      # workflow_dispatch uses branch ref — no tag; take version from pubspec like local release scripts.
      - name: Resolve version from pubspec (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_RAW="$(grep -m1 -E '^version:[[:space:]]+' pubspec.yaml | sed -E 's/^version:[[:space:]]+//; s/[[:space:]]*#.*//; s/[[:space:]]+$//')"
          if [[ "${VERSION_RAW}" == *+* ]]; then
            BUILD_NAME="${VERSION_RAW%%+*}"
            BUILD_NUMBER="${VERSION_RAW#*+}"
          else
            echo "pubspec version must be like 1.2.3+45, got: ${VERSION_RAW}"
            exit 1
          fi
          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "From pubspec: BUILD_NAME=${BUILD_NAME} BUILD_NUMBER=${BUILD_NUMBER}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          bundler: "2.5.23"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks
          test -s android/upload-keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Decode Google Play service account JSON
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          # Accept either raw JSON (recommended for GH Secrets) or base64 (older setup).
          if [[ "${PLAY_SERVICE_ACCOUNT_JSON_BASE64}" == \{* ]]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" > /tmp/play-service-account.json
          else
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/play-service-account.json
          fi
          test -s /tmp/play-service-account.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to Google Play (testing track)
        env:
          SUPPLY_JSON_KEY: /tmp/play-service-account.json
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ inputs.play_release_status || 'draft' }}
        run: |
          set -euo pipefail
          bundle exec fastlane android upload_play \
            aab_path:"build/app/outputs/bundle/release/app-release.aab" \
            track:"${PLAY_TRACK}" \
            release_status:"${PLAY_RELEASE_STATUS}" \
            changelog:"Automated upload from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} (${GITHUB_REF_NAME})."

      # Sideload APK: rolling release in *this* repo (no PAT). Link for site / email:
      #   ${{ github.server_url }}/${{ github.repository }}/releases/tag/android-latest
      - name: Build release APK (sideload)
        run: flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Publish android-latest (this repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-latest"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated build from ${GITHUB_REPOSITORY}@${SHORT_SHA} on $(date -u +'%Y-%m-%dT%H:%M:%SZ').

          APK: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"

          TITLE="UyDosh Android APK (latest)"
          if [[ -n "${BUILD_NAME:-}" && -n "${BUILD_NUMBER:-}" ]]; then
            TITLE="Android ${BUILD_NAME}+${BUILD_NUMBER}"
          fi

          gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" 2>/dev/null || true

          gh release create "${TAG}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      # Optional: duplicate rolling release on uydoshtech.github.io if SITE_REPO_TOKEN / UYDOSH_WEBSITE_RELEASE_TOKEN is set.
      - name: Publish APK to marketing site repo (optional)
        env:
          UYDOSH_WEBSITE_RELEASE_TOKEN: ${{ secrets.UYDOSH_WEBSITE_RELEASE_TOKEN }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          BUILD_NAME: ${{ env.BUILD_NAME }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          set -euo pipefail
          bash tool/ci/publish_mobile_to_website.sh \
            "build/app/outputs/flutter-apk/app-release.apk"

      - name: Notify by email on success
        if: success()
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: UyDosh CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "[UyDosh] Android AAB upload #${{ github.run_number }} succeeded"
          body: |
            Android AAB build + Play upload completed successfully.

            Commit:   ${{ github.sha }}
            Branch:   ${{ github.ref_name }}
            Message:  ${{ github.event.head_commit.message }}
            Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Sideload APK (android-latest in this repo):
              ${{ github.server_url }}/${{ github.repository }}/releases/tag/android-latest

      - name: Notify by email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: UyDosh CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "[UyDosh] Android AAB upload #${{ github.run_number }} FAILED"
          body: |
            Android AAB build and/or Play upload FAILED.

            Commit:   ${{ github.sha }}
            Branch:   ${{ github.ref_name }}
            Message:  ${{ github.event.head_commit.message }}
            Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Open the run above to see which step failed and view logs.
