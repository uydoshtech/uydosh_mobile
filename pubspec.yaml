name: uy_dosh
description: "Housing, roommate, and services search in Uzbekistan"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.258+392

environment:
  sdk: ">=3.5.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <0.22.0"

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # State Management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  decimal: ^3.2.1

  # Networking
  dio: ^5.8.0+1
  # pretty_dio_logger: only constructed inside `if (kDebugMode)` in
  # `public_dio_configurator.dart`, so the Dart AOT tree-shaker drops the
  # entire package from release binaries. It must stay in `dependencies:`
  # (not `dev_dependencies:`) because lib/ code references its types at
  # compile time; dev deps are unavailable to lib/ code.
  pretty_dio_logger: ^1.4.0
  curved_navigation_bar: ^1.0.6
  flutter_svg: ^2.1.0
  smooth_page_indicator: ^1.1.0
  shared_preferences: ^2.5.3
  encrypt_shared_preferences: ^0.9.10
  url_launcher: ^6.3.1
  share_plus: ^12.0.1
  app_links: ^6.3.2
  telegram_login: ^1.2.1
  image_picker: ^1.0.7
  image: ^4.1.7
  camera: ^0.11.0+2
  
  # Firebase
  firebase_core: ^3.15.2
  firebase_analytics: ^11.6.0
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.5.0
  permission_handler: ^11.3.1
  app_badge_plus: ^1.2.9
  
  # Google Sign-In
  google_sign_in: ^6.2.1

  # Sign in with Apple (App Review Guideline 4.8 — required alongside
  # Google on iOS). The plugin renders the native ASAuthorizationButton
  # via [SignInWithAppleButton]; on Android/Web it falls back to a web
  # OAuth flow which we do NOT configure here, so the button is gated
  # to iOS/macOS in [AuthWizardGoogleSignInPage].
  sign_in_with_apple: ^6.1.4
  # Promoted from transitive (firebase_auth → googleapis_auth → crypto)
  # to a direct dep because [AppleAuthService] uses [sha256] to hash
  # the SIWA nonce. Pinning here keeps the version stable even if
  # Firebase swaps its transitive dep.
  crypto: ^3.0.6
  
  # Image caching
  cached_network_image: ^3.3.1
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Dependency Injection
  get_it: ^8.0.3

  # Maps
  yandex_mapkit: ^4.1.0

  # Audio
  audioplayers: ^6.0.0

  # Celebrations
  # Fireworks are rendered by an in-house [SimpleFireworksDisplay] CustomPainter
  # (see lib/presentation/widgets/common/simple_fireworks.dart). We dropped
  # `flutter_fireworks` because it transitively pulled in `package:flame` for
  # an effect we can produce in ~250 lines of paint code.
  confetti: ^0.8.0

  # In-app tutorial
  tutorial_coach_mark: ^1.3.3
  google_generative_ai: ^0.4.7

  # iOS RoomPlan (LiDAR) — room USDZ export; Android stub in plugin
  flutter_roomplan: ^1.0.7
  # Android room-scan 3D viewer: wraps Google's <model-viewer> web component
  # in a WebView to render the server-side USDZ→GLB conversion
  # (`room_scan_glb_url`). iOS keeps its native SceneKit viewer
  # (see `RoomUsdzViewerService`); this covers the platform where the
  # native USDZ can't be opened.
  model_viewer_plus: ^1.10.0
  path_provider: ^2.1.4
  firebase_app_check: ^0.3.2+10
  # Flutter-native crop widget. We render our own UyDosh-styled crop UI on top
  # of [Crop] from this package — see [ListingCropScreen] — so we control the
  # toolbar / buttons / overlay watermark. Replaces the previous
  # [image_cropper] plugin (which was dropped to shrink the app, since its
  # native uCrop / TOCropViewController UIs added megabytes of platform code).
  crop_your_image: ^2.0.0
  dio_cache_interceptor: ^4.0.6
  # Pinned below v12 to keep iOS build compatible with CI Xcode SDK.
  # (v12 references NSProcessInfo.isiOSAppOnVision which is not available on all runners.)
  device_info_plus: ^11.3.0
  package_info_plus: ^9.0.1
  record: ^6.2.0
  geolocator: ^14.0.2
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  freezed: ^2.5.8
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  flutter_gen_runner: ^5.10.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
flutter_gen:
  output: lib/gen/
  line_length: 100

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/
    - assets/icon/components/
    - assets/images/
    - assets/images/room_scan_examples/
    - assets/sounds/

  # No bundled fonts: en/ru/uz UI is covered by the system Roboto (Android) /
  # SF Pro (iOS) fonts, both of which already include Latin + Cyrillic. For any
  # user-generated content containing other scripts (Arabic, CJK, symbols),
  # the OS provides its own fallback chain — bundling a Noto fallback inside
  # `fontFamilyFallback` ended up forcing Arabic shaping on mixed-script text
  # (see incident on listing detail screen, May 2026), so we let the platform
  # handle non-Latin glyphs natively.

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Regenerate Android launcher mipmaps from the same source as iOS App Store icon:
#   dart run flutter_launcher_icons
# Adaptive icon background matches the icon edge (avoids Pixel's white "plate" ring).
# Foreground inset keeps artwork inside the circular/squircle safe zone (Android masks clip the outer ~18%).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
  adaptive_icon_background: "#01416D"
  adaptive_icon_foreground: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
  adaptive_icon_foreground_inset: 20
