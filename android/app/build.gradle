plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.uydosh.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    defaultConfig {
        applicationId = "com.uydosh.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // yandex_mapkit requires 26; Firebase Auth supports 23+
        minSdkVersion = Math.max(flutter.minSdkVersion, 26)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            appVersionName: flutter.versionName,
            appVersionCode: "${flutter.versionCode}",
        ]

        // Ship native libs only for arm64-v8a. We dropped armv7 entirely —
        // 32-bit ARM devices on Android 8+ (our minSdk=26) are vanishingly
        // rare and each ABI we keep doubles the native code (Flutter engine
        // ~7 MB, Yandex MapKit ~3 MB, app Dart snapshot ~3–4 MB).
        // x86 / x86_64 are emulator-only and explicitly excluded below.
        //
        // If you need armv7 back, add 'armeabi-v7a' here AND change
        // ANDROID_PLATFORMS in the Makefile to 'android-arm,android-arm64'.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug

            // R8 in full mode + resource shrinker. Saves several MB by
            // removing unreachable Java/Kotlin code from Firebase, Yandex
            // Mapkit, image_picker, etc., and stripping unused res/.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    // Keep AAPT2 from compressing already-compressed assets we ship raw.
    androidResources {
        noCompress 'tflite'
    }

    // Strip x86 / x86_64 native libs that third-party AARs (notably Yandex
    // MapKit) ship even when [ndk.abiFilters] is set. We don't target Chrome
    // OS or x86 emulator users, and Play's Dynamic Delivery would otherwise
    // serve a fatter AAB. `jniLibs.excludes` is checked at the final
    // packaging stage so it catches everything regardless of source.
    //
    // If you ever need to debug on an x86_64 emulator, comment this block
    // out (or build a debug-flavoured APK; debug builds bypass excludes).
    packagingOptions {
        jniLibs {
            excludes += [
                'lib/x86/**',
                'lib/x86_64/**',
                'lib/armeabi-v7a/**',
            ]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.yandex.android:maps.mobile:4.6.1-lite'
}
