<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UyDosh">

  <!-- Locks pinch/double-tap zoom so the Telegram in-app WebView doesn't
       zoom in when a control loses focus (e.g. tapping outside a text field). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UyDosh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    /* Belt-and-suspenders: some WebViews ignore user-scalable=no and still
       honor double-tap/pinch zoom via CSS touch-action. */
    html, body {
      touch-action: manipulation;
    }
  </style>

  <!-- Google Sign-In Configuration -->
  <meta name="google-signin-client_id" content="626930983094-ir8a7rjvo8o1kjp795024ghh5abrb9o9.apps.googleusercontent.com">

  <!-- Google API Client Library -->
  <script src="https://apis.google.com/js/api.js"></script>
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UyDosh</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Extra guard for WebKit-based WebViews (incl. Telegram's) that still
    // fire pinch-zoom via gesture events despite the viewport/touch-action hints above.
    document.addEventListener('gesturestart', function (event) {
      event.preventDefault();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
