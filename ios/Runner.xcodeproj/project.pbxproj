_NAME\"\n    DSYM=\"$DSYM_DIR/$FW_NAME.framework.dSYM\"\n    if [ -f \"$BIN\" ] && [ ! -d \"$DSYM\" ]; then\n        echo \"note: Generating stub dSYM for $FW_NAME.framework\"\n        make_stub_dsym \"$BIN\" \"$DSYM\" \"$FW_NAME\"\n    fi\ndone\n";
